[package]
name = "redoubtful"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
capctl = "0.2.4"
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.186"
miette = { version = "7.6.0", features = ["fancy"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "process", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"
tempfile = { version = "3.27.0", default-features = false }
# Cargo unifies tokio features with `[dependencies]`, so list only the
# extras tests need on top of the runtime feature set.
tokio = { version = "1.52.1", features = ["net", "io-util"] }

[lints.rust]
# Document all public items.
missing_docs = "warn"

# Deny all unsafe code by default. Per-function `#[allow(unsafe_code)]` is
# permitted only for C FFIs and Tokio/std OS primitives (notably
# `CommandExt::pre_exec` for `prctl(PR_SET_PDEATHSIG)` lifecycle binding;
# see `src/cmd/run.rs`). `deny` rather than `forbid` exists precisely so
# those carveouts can be expressed; bare `unsafe` blocks elsewhere remain
# build-breakers.
unsafe_code = "deny"

[lints.clippy]
# Enable Clippy's standard warnings, at a low priority so they can be overridden
# below.
all = { priority = -1, level = "warn" }

# These are assertions, not error-handling. They should only be used in tests,
# or to indicate things which "can't happen" or which are clearly bugs.
unwrap_used = "warn"
expect_used = "warn"

# Don't allow math to `panic` on overflow. Handle it using `checked_*` or
# similar.
arithmetic-side-effects = "deny"

# Avoid `as` casts when they can be replaced with anything else, especially for
# numeric conversions. Always prefer `From` or `TryFrom` methods, and propagate
# errors up the call chain whenever there's any reasonable way to do that.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"

# No `transmute` calls at all, but these we can forbid automatically.
transmute_ptr_to_ref = "deny"
transmutes_expressible_as_ptr_casts = "deny"
wrong_transmute = "deny"
