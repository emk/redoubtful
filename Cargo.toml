[package]
name = "redoubtful"
version = "0.0.1"
edition = "2024"
# Basically almost none of this code was typed by human hands, so
# you'd have to consult a lawyer to figure out the copyright status. But
# to whatever extent it is copyrightable by me, the following license
# applies.
license = "MIT OR Apache-2.0"

readme = "README.md"
authors = ["Eric Kidd <git@randomhacks.net>"]
description = "A tool for running coding agents in sandboxes, using bwrap and pasta."
repository = "https://github.com/emk/redoubtful"

[badges]
maintenance = { status = "experimental" }

[dependencies]
capctl = "0.2.4"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16"
handlebars = "6.4.0"
hudsucker = { version = "0.25", features = ["rcgen-ca", "rustls-client"] }
hyper-rustls = "0.27.9"
hyper-util = "0.1"
libc = "0.2.186"
rustls-native-certs = "0.8.4"

miette = { version = "7.6.0", features = ["fancy"] }
openssl-probe = "0.2.1"
rcgen = "0.14.7"
# `ring` feature so the proxy can install a pure-Rust crypto provider
# at runtime via `rustls::crypto::ring::default_provider()`. Note:
# hudsucker's `rustls-client` feature transitively enables `aws-lc-rs`
# through `hyper-rustls`, so that backend's C code is in the binary
# regardless. We prefer `ring` at runtime because it's the pure-Rust
# path; revisiting aws-lc-rs vs ring at the dep-graph level is a
# stage-2 concern (when MITM actually exercises the provider).
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tempfile = { version = "3.27.0", default-features = false }
tokio = { version = "1.52.1", features = [
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
xdg = "3.0.0"
url = "2.5.8"
base64 = "0.23.0"

[dev-dependencies]
assert_cmd = "2.2.1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
predicates = "3.1.4"
rcgen = "0.14.7"
rustls = { version = "0.23", features = ["ring"] }
# Cargo unifies tokio features with `[dependencies]`, so list only the
# extras tests need on top of the runtime feature set.
tokio = { version = "1.52.1", features = ["net", "io-util"] }

[lints.rust]
# Document all public items.
missing_docs = "warn"

# Deny all unsafe code by default. Per-function `#[allow(unsafe_code)]` is
# permitted only for C FFIs and Tokio/std OS primitives (notably
# `CommandExt::pre_exec` for `prctl(PR_SET_PDEATHSIG)` lifecycle binding;
# see `src/cmd/run.rs`). `deny` rather than `forbid` exists precisely so
# those carveouts can be expressed; bare `unsafe` blocks elsewhere remain
# build-breakers.
unsafe_code = "deny"

[lints.clippy]
# Enable Clippy's standard warnings, at a low priority so they can be overridden
# below.
all = { priority = -1, level = "warn" }

# These are assertions, not error-handling. They should only be used in tests,
# or to indicate things which "can't happen" or which are clearly bugs.
unwrap_used = "warn"
expect_used = "warn"

# Don't allow math to `panic` on overflow. Handle it using `checked_*` or
# similar.
arithmetic-side-effects = "deny"

# Avoid `as` casts when they can be replaced with anything else, especially for
# numeric conversions. Always prefer `From` or `TryFrom` methods, and propagate
# errors up the call chain whenever there's any reasonable way to do that.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"

# No `transmute` calls at all, but these we can forbid automatically.
transmute_ptr_to_ref = "deny"
transmutes_expressible_as_ptr_casts = "deny"
wrong_transmute = "deny"
