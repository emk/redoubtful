# Project policies.
#
# These policies can be enforced using `cargo deny check`.

# Constrain the audited dep graph to the targets we actually build for.
# `redoubtful` is Linux-only (see ARCHITECTURE.md), so Windows-only sub-deps
# of crates like `console` resolve into `Cargo.lock` but never compile —
# without this, `cargo deny` would still audit them and we'd carry their
# advisories/licenses for no reason.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

[advisories]
ignore = []

[licenses]
# Allow common OSI-approved permissive (non-copyleft) licenses.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Mozilla's CA root bundle ships under this Linux Foundation
    # permissive data license; pulled in via `webpki-roots` (which
    # arrives transitively through hudsucker's `rustls-client` and
    # `tokio-tungstenite` dependencies).
    "CDLA-Permissive-2.0",
]

[bans]
deny = [
    # OpenSSL has caused endless deployment and build problems. We use rustls
    # for TLS everywhere.
    { name = "openssl" },
    { name = "openssl-sys" },
]
skip = [
    # `miette` pulls in both 0.1.x (directly) and 0.2.x (via `console`/`textwrap`).
    { name = "unicode-width" },
    # Upstream lag: `pem`/`rcgen` (via hudsucker) use 0.22; we use 0.23 directly.
    { name = "base64" },
    # `capctl` is stuck on bitflags 1.x; the rest of the graph uses 2.x.
    { name = "bitflags" },
    # `ring` pins getrandom 0.2; `rand`/`uuid` have moved to 0.4.
    { name = "getrandom" },
    # Ecosystem migration to syn 3.0 still in progress (syn 2 under asn1-rs/darling/etc.).
    { name = "syn" },
    # `tokio-tungstenite` uses 0.26; `hyper-rustls` uses 1.0.
    { name = "webpki-roots" },
]
